set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Status bar: fully transparent ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=white"
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 50

# --- Session pill (right), numbered from 1 ---
set -g status-right "#[fg=#3b82f6,bg=default]#[fg=white,bg=#3b82f6,bold] #{?#{m/r:^[0-9]+$,#S},#{e|+|:#S,1},#S} #[fg=#3b82f6,bg=default]"

# --- Window tabs (left) ---
setw -g window-status-separator " "
setw -g window-status-style "bg=default,fg=white"
setw -g window-status-format "#[fg=#3b82f6,bg=default]#[fg=white,bg=#3b82f6] #I #W #[fg=#3b82f6,bg=default]"
setw -g window-status-current-format "#[fg=#60a5fa,bg=default]#[fg=#0b1220,bg=#60a5fa,bold] #I #W #[fg=#60a5fa,bg=default]"
